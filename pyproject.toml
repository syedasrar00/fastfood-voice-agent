[project]
name = "fastfood-voice-agent"
version = "0.1.0"
description = "Low-latency LangGraph voice ordering agent for fast-food outlets"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.40",
    "langchain-openai>=0.3.7",
    "langgraph>=0.3.5",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "twilio>=9.4.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]